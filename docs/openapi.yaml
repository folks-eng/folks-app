components:
  schemas:
    AuthToken-created:
      properties:
        user:
          type: string
          example: Any Name
        email:
          type: string
          example: Any Name
        jwt:
          type: string
          example: Any Name
        validityHr:
          type: number
          format: int64
          example: '3591'
    Payment-created:
      properties:
        paymentId:
          type: int64
          example: 100
        bookingId:
          type: integer
          example: 100
        canonicalLink:
          type: string
          example: /api/v1/payments/$batch/100
    Payment-modified:
      type: object
      properties:
        code:
          type: string
          example: app_code
        message:
          type: string
          example: Payment modified successfully
    Payment:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
          example: 100
        bookingId:
          type: integer
          format: int64
          example: 100
        amount:
          type: number
          format: double
          example: 720000.45
        paymentMethod:
          type: string
          _enum:
          - CARD
          - UPI
          - WALLET
          - COD
        paymentStatus:
          type: string
          _enum:
          - INITIATED
          - SUCCESS
          - FAILED
          - REFUNDED
        transactionRef:
          type: string
        paidAt:
          type: string
          format: date
          example: '2026-05-25'
    Payment-paged:
      properties:
        total:
          type: integer
          description: Total number of Payments
          example: '45'
        items:
          type: array
          items:
            properties:
              paymentId:
                type: int64
                example: 100
              bookingId:
                type: integer
                example: 100
              canonicalLink:
                type: string
                example: /api/v1/payments/100
        nextLink:
          type: string
          example: /api/v1/payments?offset=10&limit=10
        previousLink:
          type: string
          example: /api/v1/payments?offset=0&limit=10
        hasMore:
          type: boolean
          example: true
    User-created:
      properties:
        userId:
          type: int64
          example: 100
        fullName:
          type: string
          example: Any Name
        createdAt:
          type: string
          format: date
          example: '2026-05-25'
        updatedAt:
          type: string
          format: date
          example: '2026-05-25'
        canonicalLink:
          type: string
          example: /api/v1/users/$batch/100
    User-modified:
      type: object
      properties:
        code:
          type: string
          example: app_code
        message:
          type: string
          example: User modified successfully
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 100
        fullName:
          type: string
        email:
          type: string
        phone1:
          type: string
        phone2:
          type: string
        passwordHash:
          type: string
        role:
          type: string
          _enum:
          - CUSTOMER
          - PROFESSIONAL
          - ADMIN
        status:
          type: string
          _enum:
          - ACTIVE
          - INACTIVE
          - BLOCKED
        createdAt:
          type: string
          format: date
          example: '2026-05-25'
        updatedAt:
          type: string
          format: date
          example: '2026-05-25'
    User-paged:
      properties:
        total:
          type: integer
          description: Total number of Users
          example: '45'
        items:
          type: array
          items:
            properties:
              userId:
                type: int64
                example: 100
              fullName:
                type: string
                example: Any Name
              createdAt:
                type: string
                format: date
                example: '2026-05-25'
              updatedAt:
                type: string
                format: date
                example: '2026-05-25'
              canonicalLink:
                type: string
                example: /api/v1/users/100
        nextLink:
          type: string
          example: /api/v1/users?offset=10&limit=10
        previousLink:
          type: string
          example: /api/v1/users?offset=0&limit=10
        hasMore:
          type: boolean
          example: true
    Address-created:
